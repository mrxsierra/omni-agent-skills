name: "💡 Feature Request"
description: "Suggest an improvement or feature for registry tooling, schemas, or docs"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement!
        Please review [docs/foundation/scope-and-non-goals.md](https://github.com/mrxsierra/omni-agent-skills/blob/main/docs/foundation/scope-and-non-goals.md) to ensure the request is in scope for this repository.
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Gap"
      description: "Is your feature request related to a problem or missing capability? Please describe."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or features you've considered."
  - type: checkboxes
    id: adr_awareness
    attributes:
      label: "Architectural Impact"
      options:
        - label: "I understand that material changes to schemas or discovery tiers require an ADR (docs/adr/)"
          required: false
