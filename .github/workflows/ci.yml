name: CI & Security Verification

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Zero-PII Security Sanitizer
      run: python3 scripts/sanitize.py

    - name: Verify & Rebuild Machine Registry (registry.json & llms.txt)
      run: python3 scripts/build_registry.py

    - name: Validate generated registry contract
      run: python3 scripts/validate_registry.py

    - name: Validate ADR and RFC integrity
      run: python3 scripts/manage_adr.py validate

    - name: Verify Evaluation Scorecard is Up to Date
      run: python3 scripts/build_eval_report.py --check

    - name: Run project smoke tests
      run: python3 -m unittest discover -s tests -p 'test_*.py'

    - name: Run Deterministic Asset Evaluation Gate (Mock Provider - 100% Catalog Coverage)
      run: |
        python3 -c '
        import glob, subprocess, sys
        assets = sorted(glob.glob("registry/skills/**/SKILL.md", recursive=True)) + ["registry/rules/global/security_shield.md"]
        print(f"Executing deterministic quality gate across {len(assets)} assets...")
        for asset in assets:
            res = subprocess.run(["python3", "scripts/eval_asset.py", "--asset", asset, "--provider", "mock", "--strict"])
            if res.returncode != 0:
                sys.exit(res.returncode)
        print("All assets passed deterministic quality gate.")
        '

    - name: Check for Uncommitted Generated Artifacts
      run: git diff --exit-code registry/registry.json llms.txt evals/README.md docs/adr/README.md
