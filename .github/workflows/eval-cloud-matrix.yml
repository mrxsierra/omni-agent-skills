name: Cloud Neural Evaluation Matrix

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud Provider (openrouter, openai, mock)'
        required: true
        default: 'openrouter'
      model:
        description: 'Model identifier'
        required: true
        default: 'anthropic/claude-3.5-sonnet'

jobs:
  eval-matrix:
    name: Cloud Evaluation Matrix (${{ inputs.provider || 'openrouter' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Cloud Evaluation Suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ inputs.provider || 'openrouter' }}
          MODEL: ${{ inputs.model || 'anthropic/claude-3.5-sonnet' }}
        run: |
          python3 -c '
          import os, glob, subprocess, sys

          provider = os.environ.get("PROVIDER", "openrouter")
          model = os.environ.get("MODEL", "anthropic/claude-3.5-sonnet")
          has_key = bool(os.environ.get("OPENROUTER_API_KEY") or os.environ.get("OPENAI_API_KEY"))

          if not has_key and provider != "mock":
              print(f"Notice: No cloud API key configured. Executing deterministic mock suite fallback.")
              provider = "mock"
              model = "mock-deterministic-v1"

          assets = sorted(glob.glob("registry/skills/**/SKILL.md", recursive=True)) + ["registry/rules/global/security_shield.md"]
          print(f"Running evaluation matrix on {len(assets)} assets with provider={provider}, model={model}...")

          passed = 0
          for asset in assets:
              print(f"\n--- Evaluating {asset} ---")
              cmd = ["python3", "scripts/eval_asset.py", "--asset", asset, "--provider", provider, "--model", model]
              res = subprocess.run(cmd)
              if res.returncode == 0:
                  passed += 1

          print(f"\nEvaluation Matrix Complete: {passed}/{len(assets)} passed gate.")
          '

      - name: Update Public Scorecard if needed
        run: |
          python3 scripts/build_eval_report.py
