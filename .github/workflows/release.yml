# Release workflow: build tarball, create checksums, and upload artifacts.
# Trigger: push a tag like v1.2.3. This example demonstrates artifact production only.
# Note: Add signing (sigstore/cosign or GPG) as a follow-up step; do not store private keys in the repo.

name: Release
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create tarball
        run: |
          TAR=omni-agent-skills-${{ steps.tag.outputs.TAG }}.tar.gz
          git archive --format=tar --prefix="omni-agent-skills-${{ steps.tag.outputs.TAG }}/" ${{ steps.tag.outputs.TAG }} | gzip > $TAR
          ls -lh $TAR

      - name: Create SHA256 sums
        run: |
          TAR=omni-agent-skills-${{ steps.tag.outputs.TAG }}.tar.gz
          sha256sum $TAR > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          release_name: Release ${{ steps.tag.outputs.TAG }}
          body: "Automated release artifacts. Please verify checksums and signatures before use."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: omni-agent-skills-${{ steps.tag.outputs.TAG }}.tar.gz
          asset_name: omni-agent-skills-${{ steps.tag.outputs.TAG }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload checksum
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: sha256sums.txt
          asset_name: sha256sums.txt
          asset_content_type: text/plain

      # Optional: sign artifacts with cosign (recommended)
      # - name: Sign artifacts with cosign
      #   run: |
      #     # Use OIDC or a protected secret to sign; do NOT place private keys in repo
      #     cosign sign --key $COSIGN_KEY omni-agent-skills-${{ steps.tag.outputs.TAG }}.tar.gz
      #   env:
      #     COSIGN_KEY: ${{ secrets.COSIGN_KEY }}

      # Optional: GPG sign the checksum file
      # - name: GPG sign checksum
      #   run: |
      #     gpg --batch --yes --passphrase "$GPG_PASSPHRASE" -u "$GPG_KEY_ID" -o sha256sums.txt.asc --sign sha256sums.txt
      #   env:
      #     GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      #     GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

# Maintainers: add a signing step here (cosign/GPG) and publish the public verification material alongside the release.
