name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify Tag Matches VERSION
        run: |
          VERSION=$(cat VERSION)
          TAG="${{ steps.tag.outputs.TAG }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "❌ Release tag '$TAG' does not match repository VERSION 'v$VERSION'!"
            exit 1
          fi
          echo "✅ Release tag '$TAG' matches VERSION 'v$VERSION'."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-Release Verification Checks
        run: |
          python3 scripts/sanitize.py
          python3 scripts/build_registry.py
          python3 scripts/validate_registry.py
          python3 scripts/manage_adr.py validate
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Package Release Assets
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          TAR="omni-agent-skills-${TAG}.tar.gz"
          git archive --format=tar --prefix="omni-agent-skills-${TAG}/" "${TAG}" | gzip > "${TAR}"
          sha256sum "${TAR}" registry/registry.json llms-qa.json > sha256sums.txt
          echo "--- Generated Checksums ---"
          cat sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omni-agent-skills-${{ steps.tag.outputs.TAG }}.tar.gz
            registry/registry.json
            llms-qa.json
            sha256sums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
