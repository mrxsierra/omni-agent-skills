[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-agent-skills"
version = "0.0.1"
description = "Universal AI Agent Skill Registry & Security Harness"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sunil Sharma", email = "mrxsierra@users.noreply.github.com" }
]
keywords = [
    "ai-agent",
    "antigravity",
    "claude-code",
    "cursor",
    "agentic-skills",
    "security-shield",
    "mcp",
    "llms-txt"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/mrxsierra/omni-agent-skills"
Repository = "https://github.com/mrxsierra/omni-agent-skills.git"
Issues = "https://github.com/mrxsierra/omni-agent-skills/issues"

[project.scripts]
omni-agent-skills = "scripts.build_registry:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
